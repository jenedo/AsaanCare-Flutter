name: asaancare
description: "AsaanCare - telemedicine and digital health platform for Pakistan."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^8.3.0
  http: ^1.6.0
  supabase_flutter: ^2.8.4

  # Document and media uploads
  file_picker: ^10.3.10
  image_picker: ^1.2.3

  # Charts and UI
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0

  # Secure local storage
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
